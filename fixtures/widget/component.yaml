# The conformance fixture component. Canonical copy: each official SDK keeps an instance in
# examples/widget with metadata.id conformance/widget-go | -py | -ts (see ../README.md, "Instances").
# Not a project component: it is never added to a brickkit.yaml and has no registry rows.
apiVersion: brickkit/v1
kind: Component

metadata:
  id: conformance/widget
  name: Widget (conformance fixture)
  version: 1.0.0
  description: The fixture every official SDK implements and the component conformance suite runs against; it exercises every profile of the component protocol.
  repository: https://github.com/brickKit/be-protocol
  license: Apache-2.0
  vendor: brickKit

tags: [conformance, fixture]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/conformance/widget/v1/widget.proto, contracts/events/widget.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/widget.openapi.yaml]
  - type: metadata
    files: [assembly.yaml, contracts/errors.yaml, migrations/lifecycle.yaml, conformance/fixtures.yaml]

dependencies:
  components:
    - conformance/peer@1.0.0            # required: approve, owner snapshots, notify, the user-plane call
    - id: mdm/org@3.0.0                 # optional: legal-entity calendars; absent = degrade (README, "Degraded mode")
      optional: true

configSchema:
  type: object
  properties:
    # db profile (be-protocol schemas/config-keys.yaml)
    PG_HOST: {type: string}
    PG_PORT: {type: integer, default: 5432}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_OWNER_USER: {type: string}
    PG_OWNER_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string}
    PG_POOL_MAX: {type: integer, default: 10}
    PG_POOL_MIN_IDLE: {type: integer, default: 2}
    PG_POOL_ACQUIRE_TIMEOUT: {type: string, default: 5s}
    PG_CONN_MAX_LIFETIME: {type: string, default: 30m}
    PG_CONN_MAX_IDLE_TIME: {type: string, default: 5m}
    PG_MIGRATION_HOST: {type: string}               # absent = PG_HOST
    PG_MIGRATION_PORT: {type: integer}              # absent = PG_PORT
    # events-pub / events-sub
    EVENT_BUS_URL: {type: string}                   # one of EVENT_BUS_URL, NATS_URL
    NATS_URL: {type: string}
    EVENTS_MAX_DELIVER: {type: integer, default: 8}
    EVENTS_BACKOFF: {type: string, default: "1s,10s,1m,5m,15m,30m,1h"}
    # auth / scope
    AUTHZ_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    IAM_ISSUER: {type: string}
    TENANT_ID: {type: string}
    # jobs / lifecycle
    BUSINESS_TIMEZONE: {type: string, default: Asia/Shanghai}
    JOBS_OVERRIDES: {type: string, default: ""}
    DATA_LIFECYCLE: {type: string, default: '{"mode":"on"}'}
    # blob
    S3_URL: {type: string}
    S3_PUBLIC_URL: {type: string}                   # absent = S3_URL
    S3_REGION: {type: string, default: us-east-1}
    S3_FORCE_PATH_STYLE: {type: boolean, default: false}
    S3_BUCKET: {type: string}
    S3_ACCESS_KEY_ID: {type: string, secret: true}
    S3_SECRET_ACCESS_KEY: {type: string, secret: true}
    # core / obs / err / grpc
    OTEL_BASE_URL: {type: string, default: ""}
    DEFAULT_LOCALE: {type: string, default: zh-CN}
    LOG_LEVEL: {type: string, default: info}
    HTTP_DEFAULT_TIMEOUT: {type: string, default: 10s}
    GRPC_MAX_CONNECTION_AGE: {type: string, default: 5m}
    SHUTDOWN_GRACE: {type: string, default: 20s}
    # the widget's own keys
    WIDGET_NO_FORMAT: {type: string, default: "WG{yyyy}{mm}-{seq:05}"}
    WIDGET_LEDGER_NO_FORMAT: {type: string, default: "WL-{le}-{yyyy}{mm}-{seq:06}"}
    WIDGET_APPROVE_TIMEOUT: {type: string, default: 30s}
    WIDGET_RESERVE_HOLD_SECONDS: {type: integer, default: 900}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, PG_OWNER_USER, PG_OWNER_PASSWORD, PG_SCHEMA,
             AUTHZ_URL, IAM_JWKS_URL, IAM_ISSUER, TENANT_ID,
             S3_URL, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}   # each SDK's examples/widget; build arg BROKEN=<variant> (broken-variants.yaml)
  port: 8080
  extraPorts:
    - {name: grpc, port: 9090}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 100m, memory: 128Mi}

migration:
  command: [./component, migrate, up]

healthCheck:
  type: http
  path: /healthz
